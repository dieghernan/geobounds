url: https://dieghernan.github.io/geobounds

figures:
  dpi: 300
  fig.retina: 2

development:
  mode: auto

repo:
  branch: main

template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: 'G-LTNVYVLK36'
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image

authors:
  Diego Hernangómez:
    href: https://dieghernan.github.io/
  William & Mary geoLab:
    href: https://sites.google.com/view/wmgeolab/

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, geoBoundaries, lightswitch]
  components:
    geoBoundaries:
      icon: fa-earth-americas
      href: https://www.geoboundaries.org/
      aria-label: geoBoundaries

home:
  title: geobounds | Download administrative boundaries from geoBoundaries
  description: >
    Download individual country boundaries and global composite boundaries from
    **geoBoundaries** as **sf** objects for mapping and spatial analysis.

# Reference sections map to the roxygen `@family` tags in man/roxygen/meta.R.
# Use `has_concept()` so the reference index stays aligned with those families.
reference:
- title: Download boundaries
  desc: >
    Download individual country boundaries or global composite boundaries as
    **sf** objects. See [Get started](../articles/geobounds.html) for product
    differences and mapping workflows.
- contents:
  - has_concept("api")
- title: Inspect metadata and availability
  desc: >
    Inspect available ADM levels, boundary sources, dates and licenses.
    See [Boundary metadata](../articles/metadata.html) for field definitions
    and provenance.
- contents:
  - has_concept("metadata")
- title: Manage the cache
  desc: >
    Configure, locate or clear the archive cache.
    See [Boundary metadata](../articles/metadata.html) for cache limitations
    and reproducible workflows.
- contents:
  - has_concept("cache")
- title: About the package
  desc: >
    Package overview, citation and links to related functions and articles.
- contents:
  - geobounds-package

articles:
# pkgdown promotes the package vignette to the top-level "Get started" link.
- title: Get started
  desc: >
    Choose boundary products, download and map boundaries, then explore
    administrative levels and spatial analysis workflows.
  contents:
  - geobounds
- title: Work with metadata
  navbar: Metadata
  desc: >
    Interpret metadata fields and check availability, licensing and provenance.
    Learn how cached archives affect reproducible workflows.
  contents:
  - metadata
- title: Explore release coverage
  navbar: Release coverage
  desc: >
    Browse country coverage, available ADM levels and metadata for
    **gbOpen**, **gbHumanitarian** and **gbAuthoritative**.
  contents:
  # Include future release coverage articles following the same naming pattern.
  - starts_with("articles/gb")
- title: From the blog
  navbar: Blog posts
  desc: >
    Read background and worked examples from the One World blog.
  contents:
  - blog-introducing-geobounds

external-articles:
- name: blog-introducing-geobounds
  title: "Introducing geobounds"
  description: "Easy access to administrative boundaries from **geoBoundaries**"
  href: https://dieghernan.github.io/202602_geobounds/
