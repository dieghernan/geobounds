url: https://dieghernan.github.io/geobounds

figures:
  dpi: 300
  fig.retina: 2

development:
  mode: auto

repo:
  branch: main

template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: 'G-LTNVYVLK36'
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image

authors:
  Diego Hernangómez:
    href: https://dieghernan.github.io/
  William & Mary geoLab:
    href: https://sites.google.com/view/wmgeolab/

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, geoBoundaries, lightswitch]
  components:
    geoBoundaries:
      icon: fa-earth-americas
      href: https://www.geoboundaries.org/
      aria-label: geoBoundaries

home:
  title: geobounds | Download administrative boundaries from geoBoundaries
  description: >
    Download individual country boundaries and global composite boundaries from
    **geoBoundaries** as **sf** objects for mapping and spatial analysis.

# Reference sections map to the roxygen `@family` tags in man/roxygen/meta.R.
# Use `has_concept()` so the reference index stays aligned with those families.
reference:
- title: Download boundaries
  desc: >
    Use [`gb_get()`](gb_get.html) for individual country boundaries or
    [`gb_get_world()`](gb_get_world.html) for global composite boundaries.
    The [ADM wrappers](gb_get_adm.html) select a single administrative level.
    Downloaded boundaries are returned as
    [**sf**](https://r-spatial.github.io/sf/) objects.
- contents:
  - has_concept("api")
- title: Inspect metadata and availability
  desc: >
    Find each country's highest available ADM level with
    [`gb_get_max_adm_lvl()`](gb_get_max_adm_lvl.html). Inspect boundary sources,
    dates and licensing with [`gb_get_metadata()`](gb_get_metadata.html)
    before downloading or sharing data.
- contents:
  - has_concept("metadata")
- title: Manage the cache
  desc: >
    Set a reusable cache directory with
    [`gb_set_cache_dir()`](gb_set_cache_dir.html), locate it with
    [`gb_detect_cache_dir()`](gb_detect_cache_dir.html) and remove cached
    archives or saved configuration with
    [`gb_clear_cache()`](gb_clear_cache.html).
- contents:
  - has_concept("cache")
- title: About the package
  desc: >
    View package-level documentation, citation information and project links
    for **geobounds**.
- contents:
  - geobounds-package

articles:
# pkgdown promotes the package vignette to the top-level "Get started" link.
- title: Get started
  desc: >
    Start with downloading and mapping country boundaries, then explore
    administrative levels, cache management and spatial analysis workflows.
  contents:
  - geobounds
- title: Release coverage and metadata
  navbar: Release types
  desc: >
    Explore country coverage, available ADM levels and boundary metadata for
    **gbOpen**, **gbHumanitarian** and **gbAuthoritative**. Consult the
    source and licensing information when choosing a release type.
  contents:
  - articles/gbopen
  - articles/gbhumanitarian
  - articles/gbauthoritative
- title: From the blog
  navbar: Blog posts
  desc: >
    Read background and worked examples from the One World blog.
  contents:
  - blog-introducing-geobounds

external-articles:
- name: blog-introducing-geobounds
  title: "Introducing geobounds"
  description: "Easy access to administrative boundaries from **geoBoundaries**"
  href: https://dieghernan.github.io/202602_geobounds/
